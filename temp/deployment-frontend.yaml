apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          envFrom:
            - secretRef:
                name: frontend-env
          volumeMounts:
            - mountPath: /frontend/dist
              name: frontend-dist
      volumes:
        - name: frontend-dist
          hostPath:
            path: ./frontend/dist