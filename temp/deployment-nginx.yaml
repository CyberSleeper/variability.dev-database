apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              name: nginx-config
            - mountPath: /usr/share/nginx/html
              name: frontend-dist
          ports:
            - containerPort: 80
      volumes:
        - name: nginx-config
          hostPath:
            path: ./nginx/nginx.conf
        - name: frontend-dist
          hostPath:
            path: ./frontend/dist